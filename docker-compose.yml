services:
  connector:
    image: ghcr.io/wontonapp/wonton-remote-mcp:main-107073e@sha256:cca90d8446825ec7d00d697c6d34874615963aac79ced6dddfe6a9b587eaabf7
    environment:
      # 服务与健康检查共用 PID 预算，不按宿主 CPU 数量创建工作线程。
      TOKIO_WORKER_THREADS: "2"
    volumes:
      - data:/data
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/wonton-remote-mcp, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 5s
    restart: unless-stopped

volumes:
  data: {}

x-wonton:
  spec: "0.15"
  id: app.wonton.mcp-connector
  version: 0.2.0
  kind: system
  title: { zh: 外部工具连接器, en: Remote tool connector }
  description:
    zh: 让聊天里的 AI 使用外部网站提供的工具
    en: Connect your AI to tools offered by external services
  icon: icon.svg
  notices: [NOTICE]
  author: { name: Wonton, url: https://github.com/wontonapp }
  homepage: https://github.com/wontonapp/wonton-plugin-mcp-connector
  license: LicenseRef-Proprietary
  tags:
    zh: [工具]
    en: [Tools]
  about:
    zh: |
      外部工具仍由云吞分别安装和授权，连接器负责访问这些工具所在的网站。

      支持 HTTPS 公网服务的 Streamable HTTP 和旧式 HTTP+SSE。需要网页登录授权的服务会明确返回不支持，不伪装登录成功。
    en: |
      Wonton installs and authorizes each external tool separately. This connector reaches the services that provide those tools.

      Supports Streamable HTTP and legacy HTTP+SSE over public HTTPS. OAuth requests return an explicit unsupported result rather than pretending authorization succeeded.
  release_notes:
    zh: 替换示例网页，接入官方外部工具连接器。
    en: Replace the sample page with the official remote tool connector.
  provides:
    remote_mcp:
      service: connector
      port: 8080
  permissions: [network.egress]
  requirements:
    arch: [amd64, arm64]
    memory: 64M
